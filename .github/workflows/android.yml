name: Android CI · APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    name: Unit tests · Lint · Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and compile
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug
      - name: Print lint diagnostics on failure
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Guard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish test APK to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: ASTER-Guard-debug-apk
          path: release-files
      - name: Publish v0.2.0 test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.2.0-test"
          APK="release-files/ASTER-Guard-v0.2.0-debug.apk"
          mv release-files/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already published; not replacing an existing versioned APK."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          # ASTER Guard 0.2.0 · Test build

          **Direct Android APK** is attached below. Minimum Android 6.0 (API 23); pure Java/Dex app, no native libraries, usable on 32-bit ARMv7 and 64-bit ARM64.

          Includes local, manual installed-app audit, heuristics, certificates/permissions, APK SHA-256 and basic network metadata/usage counters.

          **Not production-ready.** No threat-intelligence feeds, continuous real-time protection, HTTPS interception, or independent detection validation. User-initiated scan and opt-in Usage Access only. Please keep Android's existing security protections enabled.

          This APK is a **CI debug build**, signed with an ephemeral debug key. Future CI builds may require uninstall/reinstall due to signing differences. A production release needs a dedicated private signing key and physical-device testing.

          Source: https://github.com/crakacr-alt/ASTER-Guard
          EOF
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "ASTER Guard 0.2.0 · Android test APK" --notes-file release-notes.md --prerelease
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG"
