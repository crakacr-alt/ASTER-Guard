name: Android CI · APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    name: Unit tests · Lint · Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Python guest-lab bridge guardrails
        run: python3 -m unittest discover -s lab/tests -v
      - name: Verify and compile
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug
      - name: Print lint diagnostics on failure
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Generate dependency inventory and APK SHA-256
        run: |
          mkdir -p reports/build
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > reports/build/dependencies.txt
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Guard-build-evidence
          path: |
            reports/build/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          retention-days: 30
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Guard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Android emulator smoke · API ${{ matrix.api-level }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android framework tests and collect metrics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          script: bash scripts/emulator-smoke.sh
      - name: Publish emulator test and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-Guard-emulator-api-${{ matrix.api-level }}
          path: |
            reports/emulator/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 30

  publish-github-release:
    name: Publish test APK to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-and-build, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: ASTER-Guard-debug-apk
          path: release-files
      - name: Publish v0.7.2 standard GitHub release (debug-key APK)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.7.2"
          APK="release-files/ASTER-Guard-v0.7.2-debug.apk"
          mv release-files/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already published; not replacing an existing versioned APK."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          # ASTER Guard 0.7.2 · Test build

          **Direct Android APK** is attached below. Minimum Android 7.0 (API 24); pure Java/Dex app, no native libraries, usable on 32-bit ARMv7 and 64-bit ARM64.

          **New in-app privacy and emulator lab controls:** DEX callsite references to ad/analytics SDKs, device IDs and sensitive APIs, opt-in Shizuku AppOps restrictions, and a separate Android guest controller UI with HTTPS certificate pinning, authenticated bridge, APK upload to guest, PID logcat/proc snapshots, JDWP Java debugger for debuggable guest apps, and HPROF memory dump export. **Actual rooted x86/x86_64 Android Emulator runs on a separate authorized lab machine, NOT inside the phone**. Includes prior file scanner, DEX/Smali, Shizuku and PCAP tools.

          **This is a normal GitHub Release page, but NOT a production-signed build.** Ephemeral CI debug key: upgrades may require reinstall. External guest is not on-device. Guest root does not guarantee debugger support for all nondebuggable apps; HPROF may fail. Guest radio toggles are not reliable malware network quarantine. No APK patcher, native LLDB, exhaustive syscall tracing, production signing key, physical-device tests or independently validated malware detection.

          This APK remains a **CI debug build** with an ephemeral key. The maintainer requested NO production signing-key setup. Reinstallation may be needed between builds. GitHub Actions runs host tests, Android lint and Android 10/15 emulator smoke checks before publishing.

          Source: https://github.com/crakacr-alt/ASTER-Guard
          EOF
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "ASTER Guard 0.7.2 · Android APK (debug signing)" --notes-file release-notes.md --latest
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG"
